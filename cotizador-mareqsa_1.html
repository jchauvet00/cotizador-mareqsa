<title>Cotizador Mareqsa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap">

<style>
:root {
  --red:        #C8102E;
  --red-dark:   #A50D25;
  --red-faint:  rgba(200,16,46,0.06);
  --ink:        #1A1A1A;
  --ink-2:      #5C5C5A;
  --ink-3:      #9A9A98;
  --border:     #E2E1DE;
  --surface:    #FFFFFF;
  --ground:     #F3F3F1;
  --stripe:     #F8F8F6;
  --shadow-sm:  0 1px 3px rgba(0,0,0,0.07), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-md:  0 2px 8px rgba(0,0,0,0.08), 0 6px 24px rgba(0,0,0,0.05);
  --r:          3px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:      #EEEEEC;
    --ink-2:    #A0A09E;
    --ink-3:    #6A6A68;
    --border:   #2C2C2A;
    --surface:  #1E1E1C;
    --ground:   #141412;
    --stripe:   #242422;
    --shadow-sm:0 1px 3px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2);
    --shadow-md:0 2px 8px rgba(0,0,0,0.35), 0 6px 24px rgba(0,0,0,0.25);
    --red-faint: rgba(200,16,46,0.09);
  }
}
:root[data-theme="dark"] {
  --ink:      #EEEEEC;
  --ink-2:    #A0A09E;
  --ink-3:    #6A6A68;
  --border:   #2C2C2A;
  --surface:  #1E1E1C;
  --ground:   #141412;
  --stripe:   #242422;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2);
  --shadow-md:0 2px 8px rgba(0,0,0,0.35), 0 6px 24px rgba(0,0,0,0.25);
  --red-faint: rgba(200,16,46,0.09);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--ground);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  line-height: 1.5;
}

.page {
  max-width: 880px;
  margin: 0 auto;
  padding: 28px 16px 72px;
}

/* â”€â”€â”€ HEADER / MEMBRETE â”€â”€â”€ */
.header {
  background: #111111;
  border-radius: var(--r);
  box-shadow: var(--shadow-md);
  margin-bottom: 14px;
  overflow: hidden;
}

.header-top {
  padding: 22px 32px 20px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}

.header-bar {
  height: 3px;
  background: var(--red);
}

.header-dolly {
  width: 100%;
  height: 200px;
  overflow: hidden;
  position: relative;
  background: #0d0d0d;
}

/* Fallback gradient shown when external image can't load (CSP in previews) */
.header-dolly::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #111 0%, #1a1a1a 40%, #0f0f0f 100%);
  z-index: 0;
}

.header-dolly img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 55%;
  display: block;
  filter: brightness(0.82) contrast(1.05);
  position: relative;
  z-index: 1;
}

.header-dolly img[src=""] ,
.header-dolly img:not([src]) {
  display: none;
}

.header-dolly-label {
  position: absolute;
  bottom: 14px;
  right: 20px;
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  z-index: 2;
}

.logo-area {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.logo-svg {
  height: 36px;
  width: auto;
}

.logo-tagline {
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.38);
}

.quote-meta {
  text-align: right;
}

.meta-label {
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 3px;
}

.meta-number {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #FFFFFF;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.meta-date {
  font-size: 12px;
  color: rgba(255,255,255,0.45);
  margin-top: 6px;
}

/* â”€â”€â”€ CARDS â”€â”€â”€ */
.card {
  background: var(--surface);
  border-radius: var(--r);
  box-shadow: var(--shadow-sm);
  margin-bottom: 14px;
  overflow: hidden;
}

.card-head {
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--stripe);
}

.card-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-2);
}

.card-body { padding: 22px 24px; }

/* â”€â”€â”€ FORM GRID â”€â”€â”€ */
.fgrid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 20px;
}

.fgrid .full { grid-column: 1 / -1; }

.field { display: flex; flex-direction: column; gap: 5px; }

.field label {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.field input,
.field textarea,
.field select {
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 8px 11px;
  width: 100%;
  outline: none;
  transition: border-color 0.14s, background 0.14s;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
  border-color: var(--red);
  background: var(--surface);
}

.field textarea {
  resize: vertical;
  min-height: 90px;
  line-height: 1.55;
}

/* â”€â”€â”€ PRODUCTS TABLE â”€â”€â”€ */
.tbl-wrap { overflow-x: auto; }

table.ptbl {
  width: 100%;
  border-collapse: collapse;
  min-width: 600px;
}

.ptbl thead th {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--border);
  background: var(--stripe);
  white-space: nowrap;
}

.ptbl thead th.r { text-align: right; }
.ptbl thead th.c { text-align: center; }

.ptbl tbody tr td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}

.ptbl tbody tr:last-child td { border-bottom: none; }

.ptbl tbody tr:nth-child(even) td { background: var(--stripe); }

.ptbl tbody tr:hover td { background: var(--red-faint); }

.ptbl .empty td {
  text-align: center;
  padding: 36px;
  color: var(--ink-3);
  font-size: 13px;
}

/* Row controls */
.sel-product {
  width: 100%;
  min-width: 200px;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 6px 10px;
  outline: none;
  cursor: pointer;
}

.sel-product:focus { border-color: var(--red); }

.inp-qty {
  width: 60px;
  text-align: center;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 6px 8px;
  outline: none;
  font-variant-numeric: tabular-nums;
}

.inp-qty:focus { border-color: var(--red); background: var(--surface); }

.inp-price {
  width: 130px;
  text-align: right;
  font-family: 'Inter', sans-serif;
  font-size: 13.5px;
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 6px 10px;
  outline: none;
  font-variant-numeric: tabular-nums;
}

.inp-price:focus { border-color: var(--red); background: var(--surface); }

.row-total {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  text-align: right;
  white-space: nowrap;
  font-size: 13.5px;
  color: var(--ink);
}

.btn-rm {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ink-3);
  font-size: 20px;
  line-height: 1;
  padding: 3px 6px;
  border-radius: var(--r);
  transition: color 0.13s, background 0.13s;
}

.btn-rm:hover { color: var(--red); background: var(--red-faint); }

/* Add row */
.add-row-area {
  padding: 13px 16px;
  border-top: 1px dashed var(--border);
}

.btn-add {
  background: none;
  border: 1px dashed var(--border);
  border-radius: var(--r);
  padding: 7px 16px;
  font-family: 'Inter', sans-serif;
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
  transition: all 0.13s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-add:hover {
  border-color: var(--red);
  color: var(--red);
  background: var(--red-faint);
}

/* â”€â”€â”€ TOTALS â”€â”€â”€ */
.totals-wrap {
  padding: 0 24px 22px;
  display: flex;
  justify-content: flex-end;
}

.totals-box {
  min-width: 280px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.total-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 32px;
  font-size: 13.5px;
}

.total-row .tl { color: var(--ink-2); }
.total-row .tv { font-variant-numeric: tabular-nums; }

.total-div {
  border: none;
  border-top: 1px solid var(--border);
  margin: 6px 0;
}
